# SPDX-License-Identifier: Apache-2.0

description: |
  Sensylink CHT8305C digital humidity and temperature sensor.

  The sensor uses I2C and supports four addresses selected by the AD0 pin:
  0x40 (GND or floating), 0x44 (VCC), 0x48 (SDA), and 0x4c (SCL).

compatible: "sensylink,cht8305c"

include: [sensor-device.yaml, i2c-device.yaml]

properties:
  reg:
    enum:
      - 0x40
      - 0x44
      - 0x48
      - 0x4c
