# Core application facilities
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SHT4X=y
CONFIG_CHT8305C=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# LLEXT plugins are discovered under /llext/business on an already mounted
# filesystem, then copied and relocated into the LLEXT RAM heap.
CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=64
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_THREAD_NAME=y
CONFIG_FILE_SYSTEM=y
